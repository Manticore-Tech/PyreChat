name: PyreChat mobile alpha

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_alpha:
        description: Build signed Android APK and upload signed iOS IPA to TestFlight
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-alpha-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  FLUTTER_VERSION: '3.47.2'
  APP_DIR: .

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android development APK
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_alpha }}
        run: flutter build apk --debug --no-pub
      - name: Save Android development APK
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_alpha }}
        uses: actions/upload-artifact@v4
        with:
          name: pyrechat-android-dev
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Check Android alpha signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_alpha }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE" "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS"; do
            if [ -z "$value" ]; then echo "::error::Android alpha signing secrets are incomplete"; exit 1; fi
          done
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/pyrechat-alpha.jks"
      - name: Build signed Android alpha
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_alpha }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pyrechat-alpha.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --no-pub --build-number="$((10000 + GITHUB_RUN_NUMBER))"
      - name: Save signed Android alpha
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_alpha }}
        uses: actions/upload-artifact@v4
        with:
          name: pyrechat-android-alpha
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  ios-compile:
    needs: checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile iOS without signing
        run: flutter build ios --release --no-codesign --no-pub

  ios-testflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_alpha }}
    needs: [checks, ios-compile]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Install Apple distribution signing assets
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_BASE64: ${{ secrets.APPSTORE_KEY_P8_BASE64 }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          for value in "$CERTIFICATE_BASE64" "$CERTIFICATE_PASSWORD" "$PROFILE_BASE64" "$APPLE_TEAM_ID" "$APPSTORE_KEY_BASE64" "$APPSTORE_KEY_ID" "$APPSTORE_ISSUER_ID"; do
            if [ -z "$value" ]; then echo "::error::Apple signing/App Store Connect secrets are incomplete"; exit 1; fi
          done
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/alpha.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/alpha.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/.appstoreconnect/private_keys"
          security cms -D -i "$RUNNER_TEMP/alpha.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/alpha.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          printf '%s' "$APPSTORE_KEY_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_KEY_ID.p8"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Configure iOS release signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          runner = project.targets.find { |target| target.name == 'Runner' }
          abort 'Runner target missing' unless runner
          runner.build_configurations.each do |config|
            next if config.name == 'Debug'
            config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PROFILE_NAME')
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
          end
          project.save
          RUBY
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>dev.pyrearms.pyrechatFlutter</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
      - name: Build signed iOS alpha
        run: flutter build ipa --release --no-pub --build-number="$((10000 + GITHUB_RUN_NUMBER))" --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload iOS alpha to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [ "${#ipas[@]}" -ne 1 ]; then echo "::error::Expected exactly one IPA"; exit 1; fi
          xcrun altool --upload-app --type ios -f "${ipas[0]}" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
      - name: Remove signing assets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/alpha.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8"
          security delete-keychain "$RUNNER_TEMP/alpha.keychain-db" 2>/dev/null || true

