name: PyreChat mobile alpha

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-alpha-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  FLUTTER_VERSION: '3.47.2'
  APP_DIR: .

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android alpha APK
        run: flutter build apk --debug --no-pub
      - name: Save Android alpha APK
        uses: actions/upload-artifact@v4
        with:
          name: pyrechat-android-alpha
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  ios-sideload:
    needs: checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile iOS without signing
        run: flutter build ios --release --no-codesign --no-pub
      - name: Package unsigned IPA for desktop sideloading
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/Payload/Runner.app"
          mkdir -p build/ios/ipa
          (
            cd "$RUNNER_TEMP"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/build/ios/ipa/PyreChat-unsigned.ipa" Payload
          )
          test -s build/ios/ipa/PyreChat-unsigned.ipa
      - name: Save iOS sideload IPA
        uses: actions/upload-artifact@v4
        with:
          name: pyrechat-ios-sideload
          path: build/ios/ipa/PyreChat-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
