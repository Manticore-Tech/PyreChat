name: Publish PyreSocial iOS v1.0.11 Public IPA Asset
on:
  push:
    branches: [ios-sideload-v101113]
    paths: [".github/workflows/publish-ios-v101113.yml"]
permissions:
  contents: write
  actions: read
jobs:
  publish-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN: "38085190644"
      EXPECTED_SOURCE_SHA: "1e6d93cf0216632948302d507629e526785f4657"
      FILE: "PyreSocial-RCS-v1.0.11-unsigned.ipa"
      ASSET_BRANCH: "ios-v1.0.11-unsigned-assets"
    steps:
      - uses: actions/checkout@v5
      - name: Await audited macOS build and artifact
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            state=$(gh run view "$TARGET_RUN" --repo "$GITHUB_REPOSITORY" --json status --jq .status)
            if [ "$state" = "completed" ]; then
              conclusion=$(gh run view "$TARGET_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
              test "$conclusion" = "success" || { echo "::error::iOS build failed ($conclusion)"; exit 1; }
              test "$(gh run view "$TARGET_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$EXPECTED_SOURCE_SHA" || { echo "::error::Source SHA mismatch"; exit 1; }
              exit 0
            fi
            sleep 15
          done
          echo "::error::Build still running after bounded 12 minute watch"
          exit 1
      - name: Verify GitHub Actions IPA payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          gh run download "$TARGET_RUN" --repo "$GITHUB_REPOSITORY" -n PyreSocial-RCS-v1.0.11-unsigned -D out
          test -s "out/$FILE"
          unzip -t "out/$FILE" >/dev/null
          unzip -Z1 "out/$FILE" | grep -Eq '^Payload/Runner.app/Info.plist$'
          echo "60c15cc545ae231ccde0459fdb8ba0cc2cb03b867f490d810c8c97d364a458ca  out/$FILE" | sha256sum --check
          sha256sum "out/$FILE" | tee out/SHA256SUMS

      - name: Publish immutable first-party iOS asset branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/$ASSET_BRANCH" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite an existing IPA asset branch"
            exit 1
          fi
          test -s "out/$FILE"
          echo "60c15cc545ae231ccde0459fdb8ba0cc2cb03b867f490d810c8c97d364a458ca  out/$FILE" | sha256sum --check
          cp "out/$FILE" "$RUNNER_TEMP/$FILE"
          git switch --orphan "$ASSET_BRANCH"
          mkdir -p downloads
          cp "$RUNNER_TEMP/$FILE" "downloads/$FILE"
          git add -f -- "downloads/$FILE"
          test "$(git diff --cached --name-only)" = "downloads/$FILE"
          test "$(git ls-files | wc -l)" -eq 1
          echo "60c15cc545ae231ccde0459fdb8ba0cc2cb03b867f490d810c8c97d364a458ca  downloads/$FILE" | sha256sum --check
          git -c user.name="MantiCore Build Tool" -c user.email="build@pyre.social" commit -m "Store SHA-verified unsigned PyreSocial iOS v1.0.11 IPA"
          git push origin "HEAD:refs/heads/$ASSET_BRANCH"
          git ls-remote --exit-code --heads origin "refs/heads/$ASSET_BRANCH"
