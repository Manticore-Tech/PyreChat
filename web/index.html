<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pyre Social — chats, Pyres, and camera sharing.">
  <meta name="theme-color" content="#080405">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pyre Social">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pyre Social</title>
  <link rel="manifest" href="manifest.json">
  <!-- Start the critical Flutter entrypoint transfer while bootstrap initializes CanvasKit. -->
  <link rel="preload" as="script" href="main.dart.js">

  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #080405;
    }

    #pyre-web-loader {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 93, 28, 0.13), transparent 34%),
        linear-gradient(180deg, #0d0708 0%, #080405 58%, #050203 100%);
      color: #fff8f2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
      opacity: 1;
      transition: opacity 180ms ease-out;
    }

    #pyre-web-loader.is-ready {
      opacity: 0;
      pointer-events: none;
    }

    .pyre-loader-stack {
      display: grid;
      justify-items: center;
      gap: 14px;
      width: min(320px, 88vw);
    }

    .pyre-loader-flame {
      width: 58px;
      height: 72px;
      filter: drop-shadow(0 0 22px rgba(255, 87, 20, 0.34));
    }

    .pyre-loader-name {
      margin-top: 2px;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.24em;
      text-indent: 0.24em;
    }

    .pyre-loader-spinner {
      width: 30px;
      height: 30px;
      margin-top: 5px;
      border: 2px solid rgba(255, 255, 255, 0.14);
      border-top-color: #ff6a22;
      border-right-color: rgba(255, 106, 34, 0.58);
      border-radius: 999px;
      animation: pyre-spin 800ms linear infinite;
    }

    .pyre-loader-copy {
      min-height: 18px;
      color: rgba(255, 244, 236, 0.64);
      font-size: 13px;
      line-height: 1.4;
    }

    @keyframes pyre-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #pyre-web-loader {
        transition: none;
      }

      .pyre-loader-spinner {
        animation-duration: 1.8s;
      }
    }
  </style>
</head>
<body>
  <div id="pyre-web-loader" role="status" aria-live="polite" aria-label="Loading Pyre Social">
    <div class="pyre-loader-stack">
      <svg class="pyre-loader-flame" viewBox="0 0 64 80" aria-hidden="true">
        <defs>
          <linearGradient id="pyre-flame-gradient" x1="32" y1="0" x2="32" y2="80" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ffad54"/>
            <stop offset="0.52" stop-color="#ff6a22"/>
            <stop offset="1" stop-color="#a51c16"/>
          </linearGradient>
        </defs>
        <path
          d="M34.2 2.8c2.2 11-6.3 15.1-3.6 24.5 1.2 4.2 4.9 7.1 8.5 8.9-.7-6.2 2.8-10.6 7.2-14.4 1.5 8.3 10.2 14 10.2 27.8C56.5 66.2 46.1 77 31.9 77 17.7 77 7.4 66.5 7.4 51.8c0-11.9 7.3-19.8 14.7-26.4 5.6-5 10.6-10.2 12.1-22.6Z"
          fill="url(#pyre-flame-gradient)"
        />
        <path
          d="M31.8 39.1c1.7 6.1-4.4 9.1-4.4 15.1 0 5.3 3.3 9.1 7.7 9.1 4.6 0 8-3.7 8-9 0-4.7-2.3-7.8-5.2-10.7-.3 4.4-2.1 6.1-4.4 7.3.5-4.5-.8-8.1-1.7-11.8Z"
          fill="#ffd39b"
          opacity="0.92"
        />
      </svg>
      <div class="pyre-loader-name">PYRE SOCIAL</div>
      <div class="pyre-loader-spinner" aria-hidden="true"></div>
      <div id="pyre-load-copy" class="pyre-loader-copy">Loading Pyre Social…</div>
    </div>
  </div>

  <script src="pyre-loader.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
