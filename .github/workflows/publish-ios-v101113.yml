name: Publish PyreSocial iOS v1.0.11 Sideload IPA
on:
  push:
    branches: [ios-sideload-v101113]
    paths: [".github/workflows/publish-ios-v101113.yml"]
permissions:
  contents: write
  actions: read
jobs:
  publish-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN: "38085190644"
      EXPECTED_SOURCE_SHA: "1e6d93cf0216632948302d507629e526785f4657"
      FILE: "PyreSocial-RCS-v1.0.11-unsigned.ipa"
      RELEASE_TAG: "ios-v1.0.11-sideload"
    steps:
      - name: Await audited macOS build and artifact
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            state=$(gh run view "$TARGET_RUN" --repo "$GITHUB_REPOSITORY" --json status --jq .status)
            if [ "$state" = "completed" ]; then
              conclusion=$(gh run view "$TARGET_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
              test "$conclusion" = "success" || { echo "::error::iOS build failed ($conclusion)"; exit 1; }
              test "$(gh run view "$TARGET_RUN" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$EXPECTED_SOURCE_SHA" || { echo "::error::Source SHA mismatch"; exit 1; }
              exit 0
            fi
            sleep 15
          done
          echo "::error::Build still running after bounded 12 minute watch"
          exit 1
      - name: Verify GitHub Actions IPA payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          gh run download "$TARGET_RUN" --repo "$GITHUB_REPOSITORY" -n PyreSocial-RCS-v1.0.11-unsigned -D out
          test -s "out/$FILE"
          unzip -t "out/$FILE" >/dev/null
          unzip -Z1 "out/$FILE" | grep -Eq '^Payload/Runner.app/Info.plist$'
          echo "60c15cc545ae231ccde0459fdb8ba0cc2cb03b867f490d810c8c97d364a458ca  out/$FILE" | sha256sum --check
          sha256sum "out/$FILE" | tee out/SHA256SUMS
      - name: Publish immutable GitHub Release download
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to overwrite an existing IPA release"
            exit 1
          fi
          gh release create "$RELEASE_TAG" "out/$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target 1e6d93cf0216632948302d507629e526785f4657 \
            --title "PyreSocial v1.0.11 — unsigned iOS sideload test" \
            --notes "Unsigned test IPA for Windows Sideloadly. Built from Flutter v1.0.11+13 via GitHub Actions run 38085190644. Native iOS Firebase/APNs notifications are disabled; test in-app RCS messaging only. Not App Store signed. Use Sideloadly to sign with your own Apple account." \
            --prerelease
